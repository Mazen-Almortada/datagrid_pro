[project]
name = "datagrid_pro"
authors = [
    { name = "Quansoft", email = "abobedro90@gmail.com"}
]
description = "Frappe app that replaces the standard Frappe list view with a DevExtreme DataGrid. It provides functions for multi-column sorting and advanced row filtering. The interface includes drag-and-drop grouping and several other features."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
